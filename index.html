<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Checklist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Minimalist Checklist</h1>
            <p class="text-gray-600">Stay organized with simple, powerful lists</p>
        </header>

        <!-- List Management Section -->
        <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
            <!-- Create New List -->
            <div class="mb-4">
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="newListInput" 
                        placeholder="Enter list name..." 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                    <button 
                        id="addListBtn" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        Add List
                    </button>
                </div>
            </div>

            <!-- List Selector -->
            <div class="flex items-center justify-between">
                <select 
                    id="listSelector" 
                    class="flex-1 mr-3 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
                    <option value="">Select a list...</option>
                </select>
                <button 
                    id="deleteListBtn" 
                    class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 disabled:bg-gray-400 disabled:cursor-not-allowed"
                    disabled
                >
                    Delete List
                </button>
            </div>
        </div>

        <!-- Active List Section -->
        <div id="activeListSection" class="bg-white rounded-lg shadow-sm border p-6 hidden">
            <!-- List Header with Progress -->
            <div class="mb-6">
                <h2 id="activeListName" class="text-xl font-semibold text-gray-800 mb-3"></h2>
                
                <!-- Progress Bar -->
                <div class="mb-2">
                    <div class="flex justify-between text-sm text-gray-600 mb-1">
                        <span>Progress</span>
                        <span id="progressText">0 / 0 tasks complete</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Add Task Section -->
            <div class="mb-6">
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="newTaskInput" 
                        placeholder="Add a new task..." 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                    <button 
                        id="addTaskBtn" 
                        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-green-500"
                    >
                        Add Task
                    </button>
                </div>
            </div>

            <!-- Tasks List -->
            <div id="tasksList" class="space-y-2">
                <!-- Tasks will be dynamically inserted here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-8 text-gray-500 hidden">
                <p>No tasks yet. Add your first task above!</p>
            </div>
        </div>

        <!-- No Lists State -->
        <div id="noListsState" class="text-center py-12 text-gray-500">
            <p class="text-lg mb-2">No lists created yet</p>
            <p>Create your first list to get started!</p>
        </div>
    </div>

    <script src="js/main.js" defer></script>
</body>
</html>
